
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byrnecut Q&A Session</title>
    <style>
        * {

        .container {

        .login-form, .question-form {

            flex-direction: column;

        }
        
        .login-form {

        .form-group {

        .moderator-controls, .control-group {

        .question-header {

        .display-logo {

        .modal-content {

        .modal-buttons {

        .modal-buttons button {

        .settings-panel {

        .display-question {

        /* ---- Discussion points ---- */
        .discussion-panel {
            border-left: 4px solid #F5A623;

        .discussion-panel summary {

        .discussion-panel ul {

        .discussion-admin-list {

        .discussion-admin-list li {

        .display-layout.with-discussion {
            display: grid;
            grid-template-columns: minmax(280px, 1fr) 2fr;
            gap: 30px;

        .display-container.wide {

        .display-discussion {

            padding: 30px;

        }

        .display-discussion li {

            margin: 12px 0;

        @media (max-width: 1000px) {
            .display-layout.with-discussion {

        .question-topic {
            font-size: 13px;
            color: #8a5a00;
            background: #fdf6ea;
            border-radius: 6px;
            padding: 4px 8px;
            margin-bottom: 12px;
            display: inline-block;
            overflow-wrap: anywhere;

        /* ---- Export / Report view ---- */
        .container.wide {
            max-width: 1100px;
        }

        select {
            padding: 8px;
            border: 2px solid #e0e0e0;

        }

        .export-panel .setting-row > label:first-child {

        }

        .export-panel .check {

        .export-panel .check input {

        .export-preview {

    </style>
</head>
<body>
    <div id="app"></div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Confirm Action</h2>
            <p id="modalMessage"></p>
            <div class="modal-buttons">
                <button onclick="window.closeModal()" class="btn-secondary">Cancel</button>
                <button id="modalConfirm" class="btn-danger">Confirm</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, set, onValue, remove, update, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyCoXUndzA5tynEW0LV7_nldit1Jx-wZXVU",
            authDomain: "conference-qa-2375a.firebaseapp.com",
            databaseURL: "https://conference-qa-2375a-default-rtdb.firebaseio.com",
            projectId: "conference-qa-2375a",
            storageBucket: "conference-qa-2375a.firebasestorage.app",
            messagingSenderId: "911059882084",
            appId: "1:911059882084:web:91ffa97c1f7564e695cf71"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const questionsRef = ref(database, 'questions');
        const settingsRef = ref(database, 'settings');
        const archiveRef = ref(database, 'archive');
        const discussionRef = ref(database, 'discussion');

        const appDiv = document.getElementById('app');
        const urlParams = new URLSearchParams(window.location.search);
        const isModerator = urlParams.get('moderator') === 'true';
        const isDisplay = urlParams.get('display') === 'true';
        const isExport = urlParams.get('export') === 'true';
        
        const MAX_QUESTION_LENGTH = 500;
        const DEFAULT_RATE_LIMIT_SECONDS = 30;
        const MAX_RATE_LIMIT_SECONDS = 600;
        const SESSION_TIMEOUT_MINUTES = 30;
        const MIN_PASSWORD_LENGTH = 8;
        const MAX_PASSWORD_LENGTH = 128;
        const MAX_DISCUSSION_POINT_LENGTH = 200;
        const DISCUSSION_TITLE = 'Discussion Points';

       const logoSVG = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='20' fill='%23F5A623'/%3E%3Ccircle cx='35' cy='35' r='12' fill='%232D2D2D'/%3E%3Ccircle cx='165' cy='35' r='12' fill='%232D2D2D'/%3E%3Ccircle cx='100' cy='67.5' r='12' fill='%232D2D2D'/%3E%3Ccircle cx='35' cy='100' r='12' fill='%232D2D2D'/%3E%3Ccircle cx='70' cy='100' r='12' fill='white' stroke='%232D2D2D' stroke-width='2'/%3E%3Ccircle cx='100' cy='100' r='12' fill='%232D2D2D'/%3E%3Ccircle cx='130' cy='100' r='12' fill='white' stroke='%232D2D2D' stroke-width='2'/%3E%3Ccircle cx='165' cy='100' r='12' fill='%232D2D2D'/%3E%3Ccircle cx='100' cy='132.5' r='12' fill='%232D2D2D'/%3E%3Ccircle cx='35' cy='165' r='12' fill='%232D2D2D'/%3E%3Ccircle cx='165' cy='165' r='12' fill='%232D2D2D'/%3E%3C/svg%3E`;
        // Session timeout management
        function updateLastActivity() {
            sessionStorage.setItem('lastActivity', Date.now().toString());
        }
        
        function checkSessionTimeout() {
            const lastActivity = sessionStorage.getItem('lastActivity');
            if (!lastActivity) {
                updateLastActivity();
                return false;
            }
            const timeSince = Date.now() - parseInt(lastActivity);
            const minutesSince = timeSince / (1000 * 60);
            if (minutesSince >= SESSION_TIMEOUT_MINUTES) {
                sessionStorage.removeItem('moderatorAuth');
                sessionStorage.removeItem('lastActivity');
                return true;
            }
            updateLastActivity();
            return false;
        }
        
        // Password management
        async function hashPassword(password, salt = '') {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + salt);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        function generateSalt() {
            const array = new Uint8Array(16);
            crypto.getRandomValues(array);
            return Array.from(array).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        async function getPasswordData() {
            const hashSnapshot = await get(ref(database, 'settings/passwordHash'));
            const saltSnapshot = await get(ref(database, 'settings/passwordSalt'));
            
            const hash = hashSnapshot.val();
            const salt = saltSnapshot.val();
            
            if (!hash) {
                const defaultHash = 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3';
                return { hash: defaultHash, salt: null, needsMigration: true };
            }
            
            return {
                hash: hash,
                salt: salt || null,
                needsMigration: !salt
            };
        }
        
        async function updatePasswordHash(newPassword) {
            const salt = generateSalt();
            const hash = await hashPassword(newPassword, salt);
            await set(ref(database, 'settings/password'), { hash, salt });
        }
        
        // Live settings, set by the moderator dashboard (settings/rateLimitSeconds, settings/autoApprove)
        let rateLimitSeconds = DEFAULT_RATE_LIMIT_SECONDS;
        let autoApprove = false;

        function normalizeRateLimit(value) {
            if (value === null || value === undefined) return DEFAULT_RATE_LIMIT_SECONDS;
            const n = Number(value);
            return Number.isInteger(n) && n >= 0 && n <= MAX_RATE_LIMIT_SECONDS ? n : DEFAULT_RATE_LIMIT_SECONDS;
        }

        // Rate limiting
        function getRemainingSeconds() {
            const lastSubmit = localStorage.getItem('lastQuestionSubmit');
            if (!lastSubmit) return 0;
            const timeSince = Date.now() - parseInt(lastSubmit);
            const remaining = (rateLimitSeconds * 1000) - timeSince;
            return Math.max(0, Math.ceil(remaining / 1000));
        }

        function checkRateLimit() {
            return getRemainingSeconds() === 0;
        }

        function setRateLimit() {
            localStorage.setItem('lastQuestionSubmit', Date.now().toString());
        }
        
        // Modal management
        window.closeModal = function() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            
            // Reset modal to default structure when closing
            const modalContent = modal.querySelector('.modal-content');
            modalContent.innerHTML = `
                <h2 id="modalTitle">Confirm Action</h2>
                <p id="modalMessage"></p>
                <div class="modal-buttons">
                    <button onclick="window.closeModal()" class="btn-secondary">Cancel</button>
                    <button id="modalConfirm" class="btn-danger">Confirm</button>
                </div>
            `;
        };
        
        function showModal(title, message, onConfirm) {
            const modal = document.getElementById('modal');
            const modalContent = modal.querySelector('.modal-content');
            
            // Always reset modal to default structure first
            modalContent.innerHTML = `
                <h2 id="modalTitle">${escapeHtml(title)}</h2>
                <p id="modalMessage">${escapeHtml(message)}</p>
                <div class="modal-buttons">
                    <button onclick="window.closeModal()" class="btn-secondary">Cancel</button>
                    <button id="modalConfirm" class="btn-danger">Confirm</button>
                </div>
            `;
            
            modal.classList.add('active');
            
            const confirmBtn = document.getElementById('modalConfirm');
            confirmBtn.onclick = () => {
                onConfirm();
                window.closeModal();
            };
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function escapeJsString(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
        
        function isValidQuestionId(id) {
            return typeof id === 'string' && id.length > 0 && id.length < 200 && /^[a-zA-Z0-9_-]+$/.test(id);
        }
        
        // Discussion points (discussion/ in Firebase), shared by all three views
        let discussion = { showOnAudience: false, showOnDisplay: false, points: [] };

        function normalizeDiscussion(data) {
            data = data || {};
            const points = Object.entries(data.points || {})
                .filter(([id, p]) => isValidQuestionId(id) && p && typeof p.text === 'string' && p.text.trim())
                // visible: missing is treated as shown (points created before per-topic toggles existed)
                .map(([id, p]) => ({ id, text: p.text, order: Number(p.order) || 0, visible: p.visible !== false }))
                .sort((a, b) => a.order - b.order || a.id.localeCompare(b.id));
            return {
                showOnAudience: data.showOnAudience === true,
                showOnDisplay: data.showOnDisplay === true,
                points
            };
        }

        // Only topics switched on by the moderator are shown on the Audience and Display views
        function visibleDiscussionPoints() {
            return discussion.points.filter(p => p.visible);
        }

        // Topics that are actually on screen somewhere right now (switched ON and shown on Audience and/or Display).
        // Saved with each question at submit time so exports can show what the question related to.
        function activeTopicTexts() {
            if (!discussion.showOnAudience && !discussion.showOnDisplay) return [];
            return visibleDiscussionPoints().map(p => p.text);
        }

        // questions/<id>/topics comes back from Firebase as an array (or object if keys are sparse)
        function normalizeTopics(value) {
            if (!value || typeof value !== 'object') return [];
            return Object.values(value).filter(t => typeof t === 'string' && t.trim());
        }

        function discussionListHtml() {
            return `<ul>${visibleDiscussionPoints().map(p => `<li>${escapeHtml(p.text)}</li>`).join('')}</ul>`;
        }

        // Audience view: collapsible panel (open by default) so it doesn't push the form off a phone screen
        function updateAudienceDiscussion() {
            const host = document.getElementById('audienceDiscussion');
            if (!host) return;
            const count = visibleDiscussionPoints().length;
            if (!discussion.showOnAudience || count === 0) {
                host.innerHTML = '';
                return;
            }
            const existing = host.querySelector('details');

        function reviewNoteText() {

        function renderClosedView() {

            appDiv.innerHTML = `

        // Enables/disables Submit based on the cooldown, without touching what the user has typed
        function updateSubmitAvailability() {
            if (rateLimitInterval) {
                clearInterval(rateLimitInterval);
                rateLimitInterval = null;
            }

            const submitBtn = document.getElementById('submitBtn');
            const waitMessage = document.getElementById('waitMessage');
            const countdown = document.getElementById('countdownDisplay');
            if (!submitBtn || !waitMessage || !countdown) return;

            const tick = () => {
                const remaining = getRemainingSeconds();
                countdown.textContent = remaining;
                waitMessage.hidden = remaining === 0;
                submitBtn.disabled = remaining > 0;
                if (remaining === 0 && rateLimitInterval) {
                    clearInterval(rateLimitInterval);
                    rateLimitInterval = null;
                }
            };

            tick();
            if (getRemainingSeconds() > 0) rateLimitInterval = setInterval(tick, 1000);
        }

        function renderQuestionForm() {
            appDiv.innerHTML = `
                <div class="container">
                    <div class="header">
                        <img src="${logoSVG}" alt="Byrnecut Logo" class="logo">
                        <h1>Submit Your Question</h1>
                        <p id="reviewNote">${reviewNoteText()}</p>
                    </div>
                    <div class="content">
                        <div id="audienceDiscussion"></div>
                        <form class="question-form" id="questionForm">

                            <div class="form-group">

                                <textarea id="question" placeholder="Type your question here..." required maxlength="${MAX_QUESTION_LENGTH}"></textarea>

                            <button type="submit" id="submitBtn">Submit Question</button>
                            <div id="message"></div>
                        </form>
                    </div>
                </div>
            `;

            const nameInput = document.getElementById('name');
            const questionTextarea = document.getElementById('question');
            const charCounter = document.getElementById('charCounter');

            function updateCharCounter() {
                const length = questionTextarea.value.length;
                charCounter.textContent = `${length} / ${MAX_QUESTION_LENGTH}`;
                charCounter.classList.remove('warning', 'error');
                if (length > MAX_QUESTION_LENGTH * 0.9) charCounter.classList.add('error');
                else if (length > MAX_QUESTION_LENGTH * 0.7) charCounter.classList.add('warning');
            }

            nameInput.value = draft.name;
            questionTextarea.value = draft.question;
            updateCharCounter();
            updateSubmitAvailability();
            updateAudienceDiscussion();

            nameInput.addEventListener('input', () => {
                draft.name = nameInput.value;
            });

            questionTextarea.addEventListener('input', () => {
                draft.question = questionTextarea.value;
                updateCharCounter();
            });

            document.getElementById('questionForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!checkRateLimit()) return;

                const submitBtn = document.getElementById('submitBtn');
                const messageDiv = document.getElementById('message');
                const name = nameInput.value.trim() || 'Anonymous';
                const questionText = questionTextarea.value.trim();

                if (questionText.length > MAX_QUESTION_LENGTH) {
                    messageDiv.innerHTML = '<div class="error-message">Question is too long.</div>';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';

                try {
                    const topics = activeTopicTexts();
                    await set(push(questionsRef), {
                        name,
                        question: questionText,
                        timestamp: Date.now(),
                        status: autoApprove ? 'approved' : 'pending',
                        ...(topics.length ? { topics } : {})
                    });

                    setRateLimit();
                    messageDiv.innerHTML = '<div class="success-message">✓ Question submitted successfully!</div>';
                    // Keep the name for their next question; clear only the question
                    questionTextarea.value = '';
                    draft.question = '';
                    updateCharCounter();
                    submitBtn.textContent = 'Submit Question';
                    updateSubmitAvailability();
                } catch (error) {
                    messageDiv.innerHTML = '<div class="error-message">Error submitting question.</div>';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Question';
                }
            });
        }
        
        // Moderator login
        function renderModeratorLogin() {
            appDiv.innerHTML = `
                <div class="container">

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const loginBtn = document.getElementById('loginBtn');

                const password = document.getElementById('password').value;
                
                loginBtn.disabled = true;
                loginBtn.textContent = 'Logging in...';
                messageDiv.innerHTML = '';
                
                try {
                    const passwordData = await getPasswordData();
                    
                    let isValid = false;
                    if (passwordData.salt) {
                        const hash = await hashPassword(password, passwordData.salt);
                        isValid = hash === passwordData.hash;
                    } else {
                        const hash = await hashPassword(password, '');
                        isValid = hash === passwordData.hash;
                    }
                    
                    if (isValid) {
                        sessionStorage.setItem('moderatorAuth', 'true');
                        updateLastActivity();
                        if (isExport) renderExportView();
                        else renderModeratorView();
                    } else {
                        messageDiv.innerHTML = '<div class="error-message">Incorrect password</div>';
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login';
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    messageDiv.innerHTML = `<div class="error-message">Login error: ${error.message}</div>`;
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            });

                                <button type="submit" class="btn-secondary">Add</button>
                            </form>
                            <span class="setting-hint">New topics start OFF. Enter adds; Shift+Enter starts a new line.</span>
                            <span class="setting-hint" id="discussionStatus"></span>

            document.getElementById('rateLimitForm').addEventListener('submit', (e) => {

            document.getElementById('discussionAddForm').addEventListener('submit', (e) => {

            const statusText = document.getElementById('statusText');
            const toggleBtn = document.getElementById('toggleSessionBtn');
            
            if (indicator && statusText && toggleBtn) {
                if (sessionOpen) {
                    indicator.classList.remove('closed');
                    statusText.textContent = 'Session Open';
                    toggleBtn.textContent = 'Close Session';
                    toggleBtn.className = 'btn-danger';
                } else {
                    indicator.classList.add('closed');
                    statusText.textContent = 'Session Closed';
                    toggleBtn.textContent = 'Open Session';
                    toggleBtn.className = 'btn-success';
                }
            }
        }
        
        function updateSettingsUI() {
            const autoBtn = document.getElementById('autoApproveBtn');
            const rateInput = document.getElementById('rateLimitInput');

            if (autoBtn) {
                autoBtn.textContent = autoApprove ? 'Auto-approve: ON' : 'Auto-approve: OFF';
                autoBtn.className = autoApprove ? 'btn-success' : 'btn-secondary';

            // Don't overwrite the box while the moderator is typing in it
            if (rateInput && document.activeElement !== rateInput) {
                rateInput.value = rateLimitSeconds;
            }

        window.toggleAutoApprove = async () => {
            updateLastActivity();
            const turningOn = !autoApprove;
            const updates = { 'settings/autoApprove': turningOn };
            if (turningOn) {
                Object.entries(allQuestions).forEach(([id, q]) => {
                    if (isValidQuestionId(id) && (q?.status || 'pending') === 'pending') {
                        updates[`questions/${id}/status`] = 'approved';
                    }
                });
            }
            await update(ref(database), updates);
        };

        window.saveRateLimit = async () => {
            updateLastActivity();
            const input = document.getElementById('rateLimitInput');
            const status = document.getElementById('rateLimitStatus');
            const value = Number(input.value);

            if (input.value.trim() === '' || !Number.isInteger(value) || value < 0 || value > MAX_RATE_LIMIT_SECONDS) {
                status.textContent = `Enter a whole number from 0 to ${MAX_RATE_LIMIT_SECONDS}.`;
                return;
            }

            try {
                await set(ref(database, 'settings/rateLimitSeconds'), value);
                status.textContent = `✓ Saved: ${value === 0 ? 'no limit' : value + ' seconds'} between questions.`;
            } catch (err) {
                console.error('Save rate limit error:', err);
                status.textContent = 'Could not save. Check your connection and try again.';

        };

        function updateDiscussionAdminUI() {
            const audBtn = document.getElementById('discussionAudienceBtn');
            const dispBtn = document.getElementById('discussionDisplayBtn');
            const list = document.getElementById('discussionAdminList');
            const bulkRow = document.getElementById('discussionBulkRow');
            const count = document.getElementById('discussionCount');
            if (!audBtn || !dispBtn || !list) return;

            audBtn.textContent = `Show on Audience: ${discussion.showOnAudience ? 'ON' : 'OFF'}`;
            audBtn.className = discussion.showOnAudience ? 'btn-success' : 'btn-secondary';
            dispBtn.textContent = `Show on Display: ${discussion.showOnDisplay ? 'ON' : 'OFF'}`;
            dispBtn.className = discussion.showOnDisplay ? 'btn-success' : 'btn-secondary';

            bulkRow.hidden = discussion.points.length === 0;
            count.textContent = `${visibleDiscussionPoints().length} of ${discussion.points.length} topics showing`;

            if (discussion.points.length === 0) {
                list.innerHTML = '<li><span class="point-text setting-hint">No discussion points yet.</span></li>';
                return;
            }

            const last = discussion.points.length - 1;
            list.innerHTML = discussion.points.map((p, i) => {
                const safeId = escapeJsString(p.id);
                return `
                    <li class="${p.visible ? '' : 'point-hidden'}">
                        <button class="${p.visible ? 'btn-success' : 'btn-secondary'} point-toggle" onclick="window.toggleDiscussionPoint('${safeId}')" title="Show/hide this topic on the Audience and Display views">${p.visible ? 'ON' : 'OFF'}</button>
                        <span class="point-text">${escapeHtml(p.text)}</span>
                        <button class="btn-secondary" onclick="window.moveDiscussionPoint('${safeId}', -1)" ${i === 0 ? 'disabled' : ''} title="Move up" aria-label="Move up">&uarr;</button>
                        <button class="btn-secondary" onclick="window.moveDiscussionPoint('${safeId}', 1)" ${i === last ? 'disabled' : ''} title="Move down" aria-label="Move down">&darr;</button>
                        <button class="btn-reject" onclick="window.deleteDiscussionPoint('${safeId}')" title="Delete" aria-label="Delete">&times;</button>
                    </li>
                `;
            }).join('');
        }

        window.toggleDiscussion = async (key) => {
            updateLastActivity();
            if (key !== 'showOnAudience' && key !== 'showOnDisplay') return;
            await set(ref(database, `discussion/${key}`), !discussion[key]);
        };

        window.addDiscussionPoint = async () => {
            updateLastActivity();
            const input = document.getElementById('discussionInput');
            const status = document.getElementById('discussionStatus');
            // One topic per line; strip list bullets/numbering people paste in from agendas
            const lines = input.value.split(/\r?\n/)
                .map(l => l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim())
                .filter(Boolean);
            if (lines.length === 0) return;
            const tooLong = lines.findIndex(l => l.length > MAX_DISCUSSION_POINT_LENGTH);
            if (tooLong >= 0) {
                status.textContent = `Line ${tooLong + 1} is too long - keep each topic under ${MAX_DISCUSSION_POINT_LENGTH} characters.`;
                return;
            }
            const maxOrder = discussion.points.reduce((m, p) => Math.max(m, p.order), 0);
            const updates = {};
            lines.forEach((text, k) => {
                const id = push(ref(database, 'discussion/points')).key;
                updates[`discussion/points/${id}`] = { text, order: maxOrder + k + 1, visible: false };
            });
            try {
                await update(ref(database), updates);
                input.value = '';
                status.textContent = '';
                input.focus();
            } catch (err) {
                console.error('Add discussion point error:', err);
                status.textContent = 'Could not save. Check your connection and try again.';
            }
        };

        window.toggleDiscussionPoint = async (id) => {
            updateLastActivity();
            if (!isValidQuestionId(id)) return;
            const point = discussion.points.find(p => p.id === id);
            if (!point) return;
            await set(ref(database, `discussion/points/${id}/visible`), !point.visible);

        window.setAllDiscussionVisible = async (visible) => {
            updateLastActivity();
            const updates = {};
            discussion.points.forEach(p => { updates[`discussion/points/${p.id}/visible`] = visible === true; });
            if (Object.keys(updates).length) await update(ref(database), updates);
        };

        window.moveDiscussionPoint = async (id, direction) => {
            updateLastActivity();
            const i = discussion.points.findIndex(p => p.id === id);
            const j = i + direction;
            if (i < 0 || j < 0 || j >= discussion.points.length) return;
            // Renumber the whole list so duplicate/missing order values can't cause a no-op swap
            const reordered = discussion.points.slice();
            [reordered[i], reordered[j]] = [reordered[j], reordered[i]];
            const updates = {};
            reordered.forEach((p, k) => { updates[`discussion/points/${p.id}/order`] = k + 1; });
            await update(ref(database), updates);
        };

        window.deleteDiscussionPoint = (id) => {
            updateLastActivity();
            if (!isValidQuestionId(id)) return;
            const point = discussion.points.find(p => p.id === id);

        window.logout = () => {
            sessionStorage.removeItem('moderatorAuth');
            sessionStorage.removeItem('lastActivity');
            renderModeratorLogin();
        };
        
        window.toggleSession = async () => {
            updateLastActivity();
            await set(ref(database, 'settings/sessionOpen'), !sessionOpen);
        };
        
        window.archiveAndClear = () => {
            updateLastActivity();
            showModal('Archive and Clear All Questions',
                'This will save all questions to archive and clear the active session. Continue?',

                        await set(ref(database, `archive/session_${timestamp}`), {

                            date: new Date(timestamp).toISOString(),
                            questions: allQuestions
                        });
                    }
                    await remove(questionsRef);
                }
            );
        };
        
        window.downloadQuestions = () => {
            updateLastActivity();
            const questions = Object.entries(allQuestions).map(([id, data]) => ({
                ...data,
                date: new Date(data.timestamp).toISOString()
            }));
            
            const csv = [
                ['Date', 'Name', 'Question', 'Status'],
                ...questions.map(q => [
                    q.date,
                    q.name,
                    q.question.replace(/"/g, '""'),
                    q.status
                ])
            ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `qa_session_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        };
        
        window.showChangePassword = () => {
            updateLastActivity();
            const modal = document.getElementById('modal');
            const modalContent = modal.querySelector('.modal-content');
            modalContent.innerHTML = `
                <h2>Change Moderator Password</h2>
                <form id="changePasswordForm" style="margin-top: 20px;">
                    <div class="form-group">
                        <label for="currentPassword">Current Password (to verify)</label>
                        <input type="password" id="currentPassword" required style="width: 100%; margin-bottom: 15px;">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password (min 8 characters)</label>
                        <input type="password" id="newPassword" required style="width: 100%; margin-bottom: 15px;">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" required style="width: 100%; margin-bottom: 15px;">
                    </div>
                    <div id="passwordMessage" style="margin-bottom: 15px;"></div>
                    <div class="modal-buttons">
                        <button type="button" onclick="window.closeModal()" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-success">Generate Hash</button>
                    </div>
                </form>
            `;
            modal.classList.add('active');
            
            document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const messageDiv = document.getElementById('passwordMessage');
                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (currentPassword.length === 0 || currentPassword.length > MAX_PASSWORD_LENGTH) {
                    messageDiv.innerHTML = '<div class="error-message">Current password is invalid.</div>';
                    return;
                }

                if (newPassword.length < MIN_PASSWORD_LENGTH) {
                    messageDiv.innerHTML = `<div class="error-message">New password must be at least ${MIN_PASSWORD_LENGTH} characters.</div>`;
                    return;
                }

                if (newPassword.length > MAX_PASSWORD_LENGTH) {
                    messageDiv.innerHTML = `<div class="error-message">New password must be no more than ${MAX_PASSWORD_LENGTH} characters.</div>`;
                    return;
                }

                if (newPassword !== confirmPassword) {
                    messageDiv.innerHTML = '<div class="error-message">New password and confirmation do not match.</div>';
                    return;
                }

                try {
                    const passwordData = await getPasswordData();
                    
                    // Verify current password
                    let isValid = false;
                    if (passwordData.salt) {
                        const currentHash = await hashPassword(currentPassword, passwordData.salt);
                        isValid = currentHash === passwordData.hash;
                    } else if (passwordData.needsMigration) {
                        const oldHash = await hashPassword(currentPassword, '');
                        isValid = oldHash === passwordData.hash;
                    }
                    
                    if (!isValid) {
                        messageDiv.innerHTML = '<div class="error-message">Current password is incorrect.</div>';
                        return;
                    }

                    // Generate new hash and salt
                    const newSalt = generateSalt();
                    const newHash = await hashPassword(newPassword, newSalt);
                    
                    // Display the hash and salt for manual entry
                    modalContent.innerHTML = `
                        <h2>Password Hash Generated</h2>
                        <p style="margin: 15px 0; color: #155724; background: #d4edda; padding: 10px; border-radius: 5px;">
                            ✓ Current password verified successfully
                        </p>
                        <p style="margin: 15px 0; font-weight: 600;">Copy these values into Firebase Console:</p>
                        
                        <div style="margin: 15px 0;">
                            <label style="display: block; font-weight: 600; margin-bottom: 5px;">Hash:</label>
                            <textarea readonly id="hashValue" style="width: 100%; height: 60px; font-family: monospace; font-size: 11px; padding: 10px; margin-bottom: 5px;">${newHash}</textarea>
                            <button type="button" onclick="navigator.clipboard.writeText('${newHash}').then(() => alert('Hash copied!'))" class="btn-secondary" style="padding: 6px 12px; font-size: 12px;">Copy Hash</button>
                        </div>
                        
                        <div style="margin: 15px 0;">
                            <label style="display: block; font-weight: 600; margin-bottom: 5px;">Salt:</label>
                            <textarea readonly id="saltValue" style="width: 100%; height: 60px; font-family: monospace; font-size: 11px; padding: 10px; margin-bottom: 5px;">${newSalt}</textarea>
                            <button type="button" onclick="navigator.clipboard.writeText('${newSalt}').then(() => alert('Salt copied!'))" class="btn-secondary" style="padding: 6px 12px; font-size: 12px;">Copy Salt</button>
                        </div>
                        
                        <div style="margin: 20px 0; padding: 15px; background: #d1ecf1; border-left: 4px solid #0c5460; font-size: 13px;">
                            <strong>Instructions:</strong>
                            <ol style="margin: 10px 0; padding-left: 20px;">
                                <li>Go to <strong>Firebase Console → Realtime Database</strong></li>
                                <li>Navigate to <strong>settings</strong></li>
                                <li>Update (or create) <strong>passwordHash</strong> field with the hash above</li>
                                <li>Update (or create) <strong>passwordSalt</strong> field with the salt above</li>
                                <li>Your new password will be active immediately</li>
                            </ol>
                        </div>
                        
                        <div class="modal-buttons">
                            <button type="button" onclick="window.closeModal()" class="btn-success">Done</button>
                        </div>
                    `;
                } catch (err) {
                    messageDiv.innerHTML = '<div class="error-message">Error generating password hash.</div>';
                    console.error('Password generation error:', err);
                }
            });
        };

        function isValidStatus(status) {
            return ['pending', 'approved', 'answered'].includes(status);
        }

        window.filterQuestions = (filter) => {
            updateLastActivity();
            const validFilters = ['all', 'pending', 'approved', 'answered'];
            if (validFilters.includes(filter)) {
                currentFilter = filter;
                
                ['filterAll', 'filterPending', 'filterApproved', 'filterAnswered'].forEach(btnId => {
                    const btn = document.getElementById(btnId);
                    if (btn) {
                        btn.style.opacity = '1';
                        btn.style.fontWeight = 'normal';
                    }
                });
                
                const activeBtnMap = {
                    'all': 'filterAll',
                    'pending': 'filterPending',
                    'approved': 'filterApproved',
                    'answered': 'filterAnswered'
                };
                
                const activeBtn = document.getElementById(activeBtnMap[filter]);
                if (activeBtn) {
                    activeBtn.style.opacity = '0.8';
                    activeBtn.style.fontWeight = '700';
                }
                
                displayQuestions();
            } else {
                console.error('Invalid filter value:', filter);
            }
        };

        window.approveQuestion = async (id) => {
            updateLastActivity();
            if (!isValidQuestionId(id)) {
                console.error('Invalid question ID for approval:', id);
                return;
            }
            await update(ref(database, `questions/${id}`), { status: 'approved' });
        };

        window.rejectQuestion = (id) => {
            updateLastActivity();
            if (!isValidQuestionId(id)) {
                console.error('Invalid question ID for rejection:', id);
                return;
            }
            showModal('Reject question', 'This will permanently delete the question. Continue?', async () => {
                await remove(ref(database, `questions/${id}`));
            });
        };

        window.markAnswered = async (id) => {
            updateLastActivity();
            if (!isValidQuestionId(id)) {
                console.error('Invalid question ID for marking answered:', id);
                return;
            }
            await update(ref(database, `questions/${id}`), { status: 'answered' });
        };

        function displayQuestions() {
            const list = document.getElementById('questionList');
            if (!list) return;

            const entries = Object.entries(allQuestions || {})
                .map(([id, q]) => ({ id, ...(q || {}) }))
                .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            const filtered = entries.filter(q => currentFilter === 'all' || q.status === currentFilter);

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h10a2 2 0 012 2v14a2 2 0 01-2 2z"></path>
                        </svg>
                        <h3>No questions</h3>
                        <p>Nothing to show for this filter.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(q => {
                const rawStatus = q.status || 'pending';
                const status = isValidStatus(rawStatus) ? rawStatus : 'pending';
                const safeQuestion = escapeHtml(q.question || '');
                const safeName = escapeHtml(q.name || 'Anonymous');
                const date = q.timestamp ? new Date(q.timestamp).toLocaleString() : '';
                
                if (!isValidQuestionId(q.id)) {
                    console.error('Invalid question ID:', q.id);
                    return '';
                }
                const safeId = escapeJsString(q.id);
                const topics = normalizeTopics(q.topics);
                const topicsHtml = topics.length
                    ? `<div class="question-topic">Topic: ${topics.map(escapeHtml).join(' · ')}</div>`
                    : '';

                const actions = (status === 'pending') ? `
                    <button class="btn-approve" onclick="window.approveQuestion('${safeId}')">Approve</button>
                    <button class="btn-reject" onclick="window.rejectQuestion('${safeId}')">Reject</button>
                ` : (status === 'approved') ? `
                    <button class="btn-answer" onclick="window.markAnswered('${safeId}')">Mark Answered</button>
                    <button class="btn-reject" onclick="window.rejectQuestion('${safeId}')">Delete</button>
                ` : `
                    <button class="btn-reject" onclick="window.rejectQuestion('${safeId}')">Delete</button>
                `;

                return `
                    <div class="question-card ${status}">
                        <div class="question-header">
                            <div class="question-meta">${date}</div>
                            <span class="question-status status-${status}">${status}</span>
                        </div>
                        <div class="question-text">${safeQuestion}</div>
                        <div class="question-name">— ${safeName}</div>
                        ${topicsHtml}
                        <div class="question-actions">${actions}</div>
                    </div>
                `;
            }).join('');
        }

        function renderDisplayView() {
            document.body.style.padding = '0';
            document.body.style.background = '#2D2D2D';

            appDiv.innerHTML = `
                <div class="display-view">
                    <div class="display-container">
                        <div class="display-header">
                            <img src="${logoSVG}" alt="Byrnecut Logo" class="display-logo">
                            <div class="display-title">Byrnecut Engineering Professional Development Day</div>
                        </div>
                        <div class="display-layout" id="displayLayout">
                            <aside class="display-discussion" id="displayDiscussion" hidden></aside>
                            <div id="displayQuestions"></div>
                        </div>
                    </div>
                </div>
            `;

            const host = document.getElementById('displayQuestions');
            host.innerHTML = '<div class="loading">Loading questions...</div>';

            onValue(discussionRef, (snapshot) => {
                discussion = normalizeDiscussion(snapshot.val());
                const layout = document.getElementById('displayLayout');
                const panel = document.getElementById('displayDiscussion');
                const show = discussion.showOnDisplay && visibleDiscussionPoints().length > 0;
                layout.classList.toggle('with-discussion', show);
                layout.parentElement.classList.toggle('wide', show);
                panel.hidden = !show;
                panel.innerHTML = show ? `<h2>${DISCUSSION_TITLE}</h2>${discussionListHtml()}` : '';
            });

            onValue(questionsRef, (snapshot) => {
                const data = snapshot.val() || {};
                const approved = Object.entries(data)
                    .map(([id, q]) => ({ id, ...(q || {}) }))
                    .filter(q => q.status === 'approved')
                    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                if (approved.length === 0) {
                    host.innerHTML = `
                        <div class="display-question">
                            <div class="display-question-body">
                                <div class="display-question-text">No submissions.</div>
                                <div class="display-question-name">Waiting on responces</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                host.innerHTML = approved.map(q => {
                    if (!isValidQuestionId(q.id)) return '';
                    const safeId = escapeJsString(q.id);
                    return `
                        <div class="display-question">
                            <div class="display-question-body">
                                <div class="display-question-text">${escapeHtml(q.question || '')}</div>
                                <div class="display-question-name">— ${escapeHtml(q.name || 'Anonymous')}</div>
                            </div>
                            <button onclick="window.markAnswered('${safeId}')" class="btn-tick" title="Mark answered" aria-label="Mark answered">&#10003;</button>
                        </div>
                    `;
                }).join('');
            });
        }

        // ---- Export / Report view (?export=true, moderator password) ----
        // Reads current questions + archive live, filters by source/date/status, groups by the discussion
        // topics saved on each question at submit time, previews the report and downloads HTML / JSON / CSV.
        const exportState = { current: null, archive: null, datesInitialised: false, questions: [], options: null };
        const STATUS_LABELS = { answered: 'Answered', approved: 'Approved, not answered', pending: 'Pending (never shown)' };
        const NO_TOPIC_LABEL = 'No discussion topic recorded';

        function pad2(n) { return String(n).padStart(2, '0'); }

        function toDateInputValue(ts) {
            const d = new Date(ts);
            return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        // 'YYYY-MM-DD' -> local midnight (new Date('YYYY-MM-DD') would be UTC midnight)
        function parseDateInput(value) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
            return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime() : null;
        }

        function fmtDate(ts) {
            return new Date(ts).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        }

        function fmtTime(ts) {
            return new Date(ts).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
        }

        function readExportOptions() {
            const el = (id) => document.getElementById(id);
            return {
                source: el('exportSource').value,
                from: el('exportFrom').value,
                to: el('exportTo').value,
                statuses: ['answered', 'approved', 'pending'].filter(s => el(`exportStatus_${s}`).checked),
                groupBy: el('exportGroupBy').value,
                includeNames: el('exportNames').checked,
                title: el('exportTitle').value.trim() || 'Conference Q&A'
            };
        }

        function collectExportQuestions(source) {
            const out = [];
            const seen = new Set();
            const add = (id, q, sourceLabel) => {
                if (!isValidQuestionId(id) || !q || typeof q !== 'object' || seen.has(id)) return;
                const timestamp = Number(q.timestamp);
                if (!Number.isFinite(timestamp)) return;
                seen.add(id);
                out.push({
                    id,
                    timestamp,
                    name: typeof q.name === 'string' && q.name.trim() ? q.name : 'Anonymous',
                    question: typeof q.question === 'string' ? q.question : '',
                    status: isValidStatus(q.status) ? q.status : 'pending',
                    topics: normalizeTopics(q.topics),
                    source: sourceLabel
                });
            };
            if (source !== 'archive') {
                Object.entries(exportState.current || {}).forEach(([id, q]) => add(id, q, 'Current session'));
            }
            if (source !== 'current') {
                Object.values(exportState.archive || {}).forEach((session) => {
                    if (!session || typeof session !== 'object') return;
                    const ts = Number(session.timestamp);
                    const label = Number.isFinite(ts) ? `Archived ${fmtDate(ts)} ${fmtTime(ts)}` : 'Archived';
                    Object.entries(session.questions || {}).forEach(([id, q]) => add(id, q, label));
                });
            }
            return out.sort((a, b) => a.timestamp - b.timestamp);
        }

        function filterExportQuestions(all, opts) {
            const fromTs = parseDateInput(opts.from);
            const toStart = parseDateInput(opts.to);
            let toTs = null;
            if (toStart !== null) {
                const d = new Date(toStart);
                d.setDate(d.getDate() + 1); // inclusive of the whole "to" day
                toTs = d.getTime();
            }
            return all.filter(q =>
                opts.statuses.includes(q.status) &&
                (fromTs === null || q.timestamp >= fromTs) &&
                (toTs === null || q.timestamp < toTs)
            );
        }

        // One group per distinct set of active topics, in the order they first came up; "no topic" last
        function groupQuestionsByTopic(questions) {
            const groups = new Map();
            questions.forEach(q => {
                const key = q.topics.join('\n');
                if (!groups.has(key)) groups.set(key, { topics: q.topics, questions: [] });
                groups.get(key).questions.push(q);
            });
            const list = [...groups.values()];
            return list.filter(g => g.topics.length).concat(list.filter(g => !g.topics.length));
        }

        function topicLabel(topics) {
            return topics.length ? topics.join(' · ') : NO_TOPIC_LABEL;
        }

        function exportRangeText(opts, questions) {
            const from = parseDateInput(opts.from);
            const to = parseDateInput(opts.to);
            if (from !== null && to !== null) return from === to ? fmtDate(from) : `${fmtDate(from)} – ${fmtDate(to)}`;
            if (from !== null) return `From ${fmtDate(from)}`;
            if (to !== null) return `Up to ${fmtDate(to)}`;
            if (!questions.length) return 'All dates';
            const first = questions[0].timestamp;
            const last = questions[questions.length - 1].timestamp;
            return toDateInputValue(first) === toDateInputValue(last) ? fmtDate(first) : `${fmtDate(first)} – ${fmtDate(last)}`;
        }

        function buildReportHtml(opts, questions) {
            const multiDay = new Set(questions.map(q => toDateInputValue(q.timestamp))).size > 1;
            const when = (q) => multiDay ? `${fmtDate(q.timestamp)}<br>${fmtTime(q.timestamp)}` : fmtTime(q.timestamp);
            const count = (s) => questions.filter(q => q.status === s).length;
            const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

            const row = (q, showTopic) => `
                <tr>
                    <td class="t">${when(q)}</td>
                    <td>
                        <div class="q">${escapeHtml(q.question)}</div>
                        ${opts.includeNames ? `<div class="n">— ${escapeHtml(q.name)}</div>` : ''}
                        ${showTopic && q.topics.length ? `<div class="tp">${escapeHtml(topicLabel(q.topics))}</div>` : ''}
                    </td>
                    <td class="st"><span class="s s-${q.status}">${q.status}</span></td>
                </tr>`;

            let body;
            if (!questions.length) {
                body = '<p class="empty">No questions match these filters.</p>';
            } else if (opts.groupBy === 'topic') {
                const groups = groupQuestionsByTopic(questions);
                const overview = `
                    <table class="overview">
                        <thead><tr><th>Discussion topic</th><th>Questions</th><th>Answered</th></tr></thead>
                        <tbody>${groups.map(g => `
                            <tr>
                                <td>${escapeHtml(topicLabel(g.topics))}</td>
                                <td>${g.questions.length}</td>
                                <td>${g.questions.filter(q => q.status === 'answered').length}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>`;
                body = overview + groups.map(g => `
                    <section>
                        <h2 class="${g.topics.length ? '' : 'none'}">${escapeHtml(topicLabel(g.topics))}</h2>
                        <p class="c">${plural(g.questions.length, 'question')}${g.topics.length ? '' : ' - no topic was switched on when these were asked (or they pre-date topic tracking)'}</p>
                        <table>${g.questions.map(q => row(q, false)).join('')}</table>
                    </section>`).join('');
            } else {
                body = `
                    <section>
                        <h2>All questions (in order asked)</h2>
                        <table>${questions.map(q => row(q, true)).join('')}</table>
                    </section>`;
            }

            const statusNote = opts.statuses.length === 3 ? '' : ` · Showing: ${opts.statuses.map(s => STATUS_LABELS[s]).join(', ')}`;

            return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(opts.title)} - ${escapeHtml(exportRangeText(opts, questions))}</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #2D2D2D; margin: 0; background: #fff; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
    header { display: flex; align-items: center; gap: 18px; border-bottom: 4px solid #F5A623; padding-bottom: 16px; margin-bottom: 20px; }
    header img { width: 64px; height: 64px; flex: none; }
    h1 { margin: 0; font-size: 26px; }
    .sub { color: #666; margin-top: 4px; font-size: 14px; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 0 24px; }
    .stat { flex: 1; min-width: 120px; background: #f8f9fa; border-radius: 8px; padding: 12px 14px; border-left: 4px solid #F5A623; }
    .stat b { display: block; font-size: 26px; }
    .stat span { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 10px 8px; border-bottom: 1px solid #e0e0e0; vertical-align: top; font-size: 14px; text-align: left; }
    .overview { margin-bottom: 28px; }
    .overview th { font-size: 12px; text-transform: uppercase; color: #666; border-bottom: 2px solid #2D2D2D; }
    .overview td:not(:first-child), .overview th:not(:first-child) { text-align: right; width: 1%; white-space: nowrap; }
    section { margin-bottom: 28px; }
    h2 { font-size: 18px; background: #2D2D2D; color: #fff; padding: 10px 14px; border-radius: 6px; margin: 0 0 4px; }
    h2.none { background: #6c757d; }
    .c { font-size: 12px; color: #666; margin: 0 0 6px; }
    td.t { white-space: nowrap; color: #666; width: 1%; }
    td.st { width: 1%; text-align: right; }

    .n { color: #666; font-style: italic; font-size: 13px; margin-top: 4px; }
    .tp { display: inline-block; margin-top: 6px; font-size: 12px; color: #8a5a00; background: #fdf6ea; border-radius: 4px; padding: 2px 6px; }
    .s { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
    .s-pending { background: #fff3cd; color: #856404; }
    .s-approved { background: #d4edda; color: #155724; }
    .s-answered { background: #e2e3e5; color: #383d41; }

    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <img src="${logoSVG}" alt="Byrnecut">
        <div>
            <h1>${escapeHtml(opts.title)}</h1>
            <div class="sub">${escapeHtml(exportRangeText(opts, questions))}${escapeHtml(statusNote)}</div>
        </div>
    </header>
    <div class="stats">
        <div class="stat"><b>${questions.length}</b><span>Questions</span></div>
        <div class="stat"><b>${count('answered')}</b><span>Answered</span></div>
        <div class="stat"><b>${count('approved')}</b><span>Approved, not answered</span></div>
        <div class="stat"><b>${count('pending')}</b><span>Pending</span></div>
    </div>
    ${body}
    <footer>Generated ${escapeHtml(fmtDate(Date.now()))} ${escapeHtml(fmtTime(Date.now()))} from the Byrnecut Q&amp;A app.</footer>
</div>
</body>
</html>`;
        }

        function refreshExport() {
            if (exportState.current === null || exportState.archive === null) return;
            const preview = document.getElementById('exportPreview');
            if (!preview) return;

            // First load: default to the most recent day with questions (conferences are usually one day)
            if (!exportState.datesInitialised) {
                exportState.datesInitialised = true;
                setExportLatestDay();
            }

            const opts = readExportOptions();
            const all = collectExportQuestions(opts.source);
            const questions = filterExportQuestions(all, opts);
            exportState.questions = questions;
            exportState.options = opts;

            const tagged = questions.filter(q => q.topics.length).length;
            document.getElementById('exportSummary').textContent =
                `${questions.length} of ${all.length} questions match` +
                (questions.length ? ` · ${tagged} linked to a discussion topic` : '');
            document.querySelectorAll('.export-download').forEach(b => { b.disabled = questions.length === 0; });

            preview.srcdoc = buildReportHtml(opts, questions);
        }

        function setExportLatestDay() {
            const all = collectExportQuestions(document.getElementById('exportSource').value);
            const value = all.length ? toDateInputValue(all[all.length - 1].timestamp) : '';
            document.getElementById('exportFrom').value = value;
            document.getElementById('exportTo').value = value;
        }

        function exportFileBase() {
            const opts = exportState.options;
            const slug = opts.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'qa-report';
            let range = 'all-dates';
            if (opts.from && opts.from === opts.to) range = opts.from;
            else if (opts.from || opts.to) range = `${opts.from || 'start'}_to_${opts.to || 'latest'}`;
            return `${slug}_${range}`;
        }

        function downloadFile(content, filename, type) {
            const url = URL.createObjectURL(new Blob([content], { type }));
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        window.exportDownload = (format) => {
            updateLastActivity();
            const opts = exportState.options;
            const questions = exportState.questions;
            if (!opts || !questions.length) return;
            const base = exportFileBase();

            if (format === 'html') {
                downloadFile(buildReportHtml(opts, questions), `${base}.html`, 'text/html');
            } else if (format === 'json') {
                const data = {
                    title: opts.title,
                    generated: new Date().toISOString(),
                    filters: { source: opts.source, from: opts.from || null, to: opts.to || null, statuses: opts.statuses },
                    summary: {
                        total: questions.length,
                        answered: questions.filter(q => q.status === 'answered').length,
                        approved: questions.filter(q => q.status === 'approved').length,
                        pending: questions.filter(q => q.status === 'pending').length
                    },
                    topics: groupQuestionsByTopic(questions).map(g => ({ topics: g.topics, count: g.questions.length })),
                    questions: questions.map(q => ({
                        id: q.id,
                        timestamp: q.timestamp,
                        date: new Date(q.timestamp).toISOString(),
                        ...(opts.includeNames ? { name: q.name } : {}),
                        question: q.question,
                        status: q.status,
                        topics: q.topics,
                        source: q.source
                    }))
                };
                downloadFile(JSON.stringify(data, null, 2), `${base}.json`, 'application/json');
            } else if (format === 'csv') {
                // Quote every cell; prefix formula-like text so Excel doesn't execute it
                const cell = (v) => {
                    let s = String(v ?? '');
                    if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`;
                    return `"${s.replace(/"/g, '""')}"`;
                };
                const header = ['Date', 'Time', 'Discussion topic(s)', ...(opts.includeNames ? ['Name'] : []), 'Question', 'Status', 'Source'];
                const rows = questions.map(q => [
                    toDateInputValue(q.timestamp),
                    fmtTime(q.timestamp),
                    q.topics.join(' | '),
                    ...(opts.includeNames ? [q.name] : []),
                    q.question,
                    q.status,
                    q.source
                ]);
                // BOM so Excel opens it as UTF-8
                const csv = '﻿' + [header, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
                downloadFile(csv, `${base}.csv`, 'text/csv');
            }
        };

        window.exportPrint = () => {
            updateLastActivity();
            const frame = document.getElementById('exportPreview');
            if (!frame || !frame.contentWindow) return;
            frame.contentWindow.focus();
            frame.contentWindow.print();
        };

        function renderExportView() {
            if (checkSessionTimeout()) {
                showModal('Session Expired', 'Your session has expired due to inactivity. Please log in again.', () => {
                    renderModeratorLogin();
                });
                return;
            }
            if (sessionStorage.getItem('moderatorAuth') !== 'true') {
                renderModeratorLogin();
                return;
            }
            updateLastActivity();

            appDiv.innerHTML = `
                <div class="container wide">
                    <div class="header">
                        <img src="${logoSVG}" alt="Byrnecut Logo" class="logo">
                        <h1>Export &amp; Report</h1>
                        <p>Pick the questions, preview the report, then download or print it</p>
                    </div>
                    <div class="content">
                        <div class="moderator-header">
                            <button onclick="window.location.href='?moderator=true'" class="btn-secondary">&larr; Back to Dashboard</button>
                            <button onclick="window.logout()" class="btn-secondary">Logout</button>
                        </div>
                        <div class="settings-panel export-panel">
                            <div class="setting-row">
                                <label for="exportSource">Questions from</label>
                                <select id="exportSource">
                                    <option value="both">Current + archived sessions</option>
                                    <option value="current">Current session only</option>
                                    <option value="archive">Archived sessions only</option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <label for="exportFrom">Dates</label>
                                <input type="date" id="exportFrom" aria-label="From date">
                                <span>to</span>
                                <input type="date" id="exportTo" aria-label="To date">
                                <button type="button" class="btn-secondary" id="exportLatestDay">Latest day</button>
                                <button type="button" class="btn-secondary" id="exportAllDates">All dates</button>
                            </div>
                            <div class="setting-row">
                                <label>Include</label>
                                <label class="check"><input type="checkbox" id="exportStatus_answered" checked> Answered</label>
                                <label class="check"><input type="checkbox" id="exportStatus_approved" checked> Approved (not answered)</label>
                                <label class="check"><input type="checkbox" id="exportStatus_pending" checked> Pending</label>
                            </div>
                            <div class="setting-row">
                                <label for="exportGroupBy">Layout</label>
                                <select id="exportGroupBy">
                                    <option value="topic">Group by discussion topic</option>
                                    <option value="time">In order asked</option>
                                </select>
                                <label class="check"><input type="checkbox" id="exportNames" checked> Include names</label>
                            </div>
                            <div class="setting-row">
                                <label for="exportTitle">Report title</label>
                                <input type="text" id="exportTitle" value="Conference Q&amp;A" maxlength="120">
                            </div>
                            <span class="setting-hint">Dates are your local time. Topics come from the discussion topics switched ON (and shown on Audience or Display) when each question was submitted.</span>
                            <span class="setting-hint" id="exportSummary">Loading questions...</span>
                        </div>
                        <div class="control-group">
                            <button class="btn-success export-download" onclick="window.exportDownload('html')" disabled>Download Report (HTML)</button>
                            <button class="btn-secondary export-download" onclick="window.exportPrint()" disabled>Print / Save as PDF</button>
                            <button class="btn-secondary export-download" onclick="window.exportDownload('csv')" disabled>Download CSV</button>
                            <button class="btn-secondary export-download" onclick="window.exportDownload('json')" disabled>Download JSON</button>
                        </div>
                        <iframe id="exportPreview" class="export-preview" title="Report preview"></iframe>
                    </div>
                </div>
            `;

            const preview = document.getElementById('exportPreview');
            preview.addEventListener('load', () => {
                try {
                    preview.style.height = `${preview.contentDocument.documentElement.scrollHeight + 20}px`;
                } catch (err) {
                    console.error('Preview resize error:', err);
                }
            });

            const onChange = () => { updateLastActivity(); refreshExport(); };
            ['exportSource', 'exportFrom', 'exportTo', 'exportGroupBy', 'exportNames',
             'exportStatus_answered', 'exportStatus_approved', 'exportStatus_pending']
                .forEach(id => document.getElementById(id).addEventListener('change', onChange));
            document.getElementById('exportTitle').addEventListener('input', onChange);
            document.getElementById('exportLatestDay').addEventListener('click', () => { setExportLatestDay(); onChange(); });
            document.getElementById('exportAllDates').addEventListener('click', () => {
                document.getElementById('exportFrom').value = '';
                document.getElementById('exportTo').value = '';
                onChange();
            });

            onValue(questionsRef, (snapshot) => {
                exportState.current = snapshot.val() || {};
                refreshExport();
            }, (error) => renderFatalError('Could not load questions', error));
            onValue(archiveRef, (snapshot) => {
                exportState.archive = snapshot.val() || {};
                refreshExport();
            }, (error) => renderFatalError('Could not load the archive', error));
        }

        function renderFatalError(message, err) {
            const details = err ? (err.stack || err.message || String(err)) : '';
            appDiv.innerHTML = `
                <div class="container">
                    <div class="header">
                        <img src="${logoSVG}" alt="Byrnecut Logo" class="logo">
                        <h1>App error</h1>
                        <p>Something prevented the page from loading.</p>
                    </div>
                    <div class="content">
                        <div class="error-message">${escapeHtml(message || 'Unknown error')}</div>
                        ${details ? `<pre style="white-space: pre-wrap; margin-top: 12px; font-size: 12px; color: #444;">${escapeHtml(details)}</pre>` : ''}
                        <div class="info-message" style="margin-top: 12px;">
                            If you opened this via <b>file://</b>, Firebase modules may not load. Use a local web server (e.g. VS Code Live Server).
                        </div>
                    </div>
                </div>
            `;
        }

        async function bootstrap() {
            if (!appDiv) return;
            if (isDisplay) return renderDisplayView();
            if (isExport) return renderExportView();
            if (isModerator) return renderModeratorView();
            return renderAudienceView();
        }

        // Only take over the screen for errors during startup. Once running, a transient
        // failure (e.g. a Wi-Fi blip when tapping Mark Answered) is just logged, so the
        // live display / dashboard stays up and recovers when the connection returns.
        let appStarted = false;

        window.addEventListener('error', (e) => {
            if (appStarted) {
                console.error('Uncaught error:', e.error || e.message);
                return;
            }
            renderFatalError('Uncaught error', e.error || e.message);
        });
        window.addEventListener('unhandledrejection', (e) => {
            if (appStarted) {
                console.error('Unhandled promise rejection:', e.reason);
                return;
            }
            renderFatalError('Unhandled promise rejection', e.reason);
        });

        bootstrap()
            .then(() => { appStarted = true; })
            .catch((err) => renderFatalError('Failed to start app', err));
    </script>
</body>
</html>
